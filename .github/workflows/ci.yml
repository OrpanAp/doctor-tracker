name: CI

on:
  pull_request:
  push:
    branches: [main, fix/complete-specification]

permissions:
  contents: read

concurrency:
  group: doctor-tracker-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  visual-evidence:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'fix/complete-specification'))
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        run: |
          cd frontend
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build production frontend
        run: |
          cd frontend
          npm run build
      - name: Capture screenshots with fictional data
        run: |
          cd frontend
          npm run start -- --hostname 127.0.0.1 > /tmp/doctor-tracker-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:3000/login > /dev/null
          npm run capture:screenshots
